name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build direct CUDA source contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: /tmp/mathblocks-nuget-packages
      ARTIFACT_ROOT: /tmp/mathblocks-artifacts
      TEST_RESULTS: /tmp/mathblocks-test-results
      OPENMATH_EVIDENCE: /tmp/mathblocks-openmath-evidence
      FORMULA_EVIDENCE: /tmp/mathblocks-formula-evidence
      FUZZ_EVIDENCE: /tmp/mathblocks-openmath-fuzz
      PACKAGE_EVIDENCE: /tmp/mathblocks-package-evidence
      MATHBLOCKS_LOCAL_FEED: /tmp/mathblocks-package-evidence
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify the exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify the direct source boundary
        shell: pwsh
        run: |
          $units = @(Get-ChildItem 'build/MathBlocks.CudaSourceGenerator/TranslationUnits' -Filter '*Module.cs')
          if ($units.Count -ne 12) {
              throw "The generator requires exactly 12 direct translation units."
          }

          $runtimeCudaBlocks = 'Supprocom.MathBlocks/Cuda/Blocks'
          $legacy = if (Test-Path -LiteralPath $runtimeCudaBlocks) {
              @(Get-ChildItem $runtimeCudaBlocks -Filter '*CudaBlockCatalog.cs' -Recurse)
          }
          else {
              @()
          }
          if ($legacy.Count -ne 0) {
              throw "Legacy CUDA catalog wrappers are present."
          }

          $generator = Get-Content 'build/MathBlocks.CudaSourceGenerator/Program.cs' -Raw
          foreach ($token in @('ToDeviceSource', 'ExtractTranslationUnit', 'TranslationUnitSource', 'extern "C" __global__', 'blockIdx.x')) {
              if ($generator.IndexOf($token, [StringComparison]::Ordinal) -ge 0) {
                  throw "The generator contains the forbidden CUDA rewrite token '$token'."
              }
          }

          $deviceUnits = @($units | Where-Object {
              (Get-Content $_.FullName -Raw).IndexOf('[CudaDevice(Name = "mathblocks_', [StringComparison]::Ordinal) -ge 0
          })
          if ($deviceUnits.Count -ne 11) {
              throw "Each operation family requires one direct CUDA device dispatcher."
          }

          foreach ($unit in $deviceUnits) {
              $source = Get-Content $unit.FullName -Raw
              if ($source.IndexOf('[CudaGlobal]', [StringComparison]::Ordinal) -ge 0 -or
                  $source.IndexOf('Cuda.BlockIdx.X', [StringComparison]::Ordinal) -ge 0) {
                  throw "An operation family contains a global-kernel compatibility path."
              }
          }

      - name: Restore the source generator
        run: >-
          dotnet restore build/MathBlocks.CudaSourceGenerator/MathBlocks.CudaSourceGenerator.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/generator"

      - name: Build the source generator
        run: >-
          dotnet build build/MathBlocks.CudaSourceGenerator/MathBlocks.CudaSourceGenerator.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/generator"

      - name: Restore MathBlocks
        run: >-
          dotnet restore Supprocom.MathBlocks/Supprocom.MathBlocks.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/product"

      - name: Build MathBlocks
        run: >-
          dotnet build Supprocom.MathBlocks/Supprocom.MathBlocks.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/product"

      - name: Restore MathBlocks tests
        run: >-
          dotnet restore Supprocom.MathBlocks.Tests/Supprocom.MathBlocks.Tests.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/tests"

      - name: Build MathBlocks tests
        run: >-
          dotnet build Supprocom.MathBlocks.Tests/Supprocom.MathBlocks.Tests.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/tests"

      - name: Run the portable test gate
        run: >-
          dotnet test Supprocom.MathBlocks.Tests/Supprocom.MathBlocks.Tests.csproj
          -c Release --no-build --no-restore
          --artifacts-path "$ARTIFACT_ROOT/tests"
          --filter "FullyQualifiedName!~Cuda&Category!=Performance"
          --logger "trx;LogFileName=mathblocks-portable.trx"
          --results-directory "$TEST_RESULTS"

      - name: Run the portable codec fingerprint gate
        run: >-
          dotnet test Supprocom.MathBlocks.Tests/Supprocom.MathBlocks.Tests.csproj
          -c Release --no-build --no-restore
          --artifacts-path "$ARTIFACT_ROOT/tests"
          --filter "FullyQualifiedName=Supprocom.MathBlocks.Tests.MathBlockCudaOperationContractTests.CUDA_value_codec_round_trips_every_public_value_kind"
          --logger "trx;LogFileName=mathblocks-portable-codec-fingerprint.trx"
          --results-directory "$TEST_RESULTS"

      - name: Restore the notation fuzz target
        run: >-
          dotnet restore fuzz/MathBlocks.OpenMath.Fuzz/MathBlocks.OpenMath.Fuzz.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/fuzz"

      - name: Build the notation fuzz target
        run: >-
          dotnet build fuzz/MathBlocks.OpenMath.Fuzz/MathBlocks.OpenMath.Fuzz.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/fuzz"

      - name: Replay the tracked notation corpus
        run: >-
          dotnet "$ARTIFACT_ROOT/fuzz/bin/MathBlocks.OpenMath.Fuzz/release/MathBlocks.OpenMath.Fuzz.dll"
          --replay fuzz/MathBlocks.OpenMath.Fuzz/Corpus

      - name: Run the notation coverage-guided smoke gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FUZZ_EVIDENCE/tools" "$FUZZ_EVIDENCE/corpus" "$FUZZ_EVIDENCE/findings"
          dotnet tool install SharpFuzz.CommandLine \
            --version 2.3.0 \
            --tool-path "$FUZZ_EVIDENCE/tools"
          curl --fail --location --silent --show-error \
            --output "$FUZZ_EVIDENCE/libfuzzer-dotnet" \
            https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
          echo 'C2C2A90D94C409A4AF339A0D4F244E0442C5A5D249BE0F1252BA07871F285958  /tmp/mathblocks-openmath-fuzz/libfuzzer-dotnet' | sha256sum --check
          chmod +x "$FUZZ_EVIDENCE/libfuzzer-dotnet"
          cp fuzz/MathBlocks.OpenMath.Fuzz/Corpus/* "$FUZZ_EVIDENCE/corpus/"
          target_root="$ARTIFACT_ROOT/fuzz/bin/MathBlocks.OpenMath.Fuzz/release"
          "$FUZZ_EVIDENCE/tools/sharpfuzz" \
            "$target_root/Supprocom.MathBlocks.dll" \
            Supprocom.MathBlocks.MathBlockOpenMath \
            Supprocom.MathBlocks.MathBlockFormulaInterchange
          set +e
          "$FUZZ_EVIDENCE/libfuzzer-dotnet" \
            -max_total_time=30 \
            -timeout=5 \
            -max_len=262144 \
            -seed=401 \
            -print_final_stats=1 \
            -dict=fuzz/MathBlocks.OpenMath.Fuzz/openmath.dict \
            -artifact_prefix="$FUZZ_EVIDENCE/findings/" \
            --target_path=dotnet \
            --target_arg="$target_root/MathBlocks.OpenMath.Fuzz.dll" \
            "$FUZZ_EVIDENCE/corpus" \
            > "$FUZZ_EVIDENCE/fuzz.stdout.txt" \
            2> "$FUZZ_EVIDENCE/fuzz.stderr.txt"
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$FUZZ_EVIDENCE/fuzz.exit.txt"
          cat "$FUZZ_EVIDENCE/fuzz.stdout.txt"
          cat "$FUZZ_EVIDENCE/fuzz.stderr.txt"
          test "$exit_code" -eq 0
          test -z "$(find "$FUZZ_EVIDENCE/findings" -type f -print -quit)"

      - name: Restore the OpenMath profile generator
        run: >-
          dotnet restore build/MathBlocks.OpenMathProfileGenerator/MathBlocks.OpenMathProfileGenerator.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/openmath-generator"

      - name: Build the OpenMath profile generator
        run: >-
          dotnet build build/MathBlocks.OpenMathProfileGenerator/MathBlocks.OpenMathProfileGenerator.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/openmath-generator"

      - name: Generate OpenMath verification artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:OPENMATH_EVIDENCE -Force | Out-Null
          $generator = Join-Path `
            $env:ARTIFACT_ROOT `
            'openmath-generator/bin/MathBlocks.OpenMathProfileGenerator/release/MathBlocks.OpenMathProfileGenerator.dll'
          dotnet $generator `
            --output "$env:OPENMATH_EVIDENCE/generated-profile" `
            --sample "$env:OPENMATH_EVIDENCE/canonical-sample.xml" `
            --catalog-sample "$env:OPENMATH_EVIDENCE/catalog-sample.xml"

      - name: Verify generated OpenMath profile artifacts
        shell: pwsh
        run: |
          $generatedRoot = Join-Path $env:OPENMATH_EVIDENCE 'generated-profile'
          $generatedFiles = @(Get-ChildItem $generatedRoot -File | Sort-Object Name)
          if ($generatedFiles.Count -ne 5) {
              throw 'The profile generator did not create five standard artifacts.'
          }

          foreach ($generated in $generatedFiles) {
              $tracked = Join-Path 'openmath/v1' $generated.Name
              $expectedHash = (Get-FileHash $tracked -Algorithm SHA256).Hash
              $actualHash = (Get-FileHash $generated.FullName -Algorithm SHA256).Hash
              if ($actualHash -ne $expectedHash) {
                  throw "The generated OpenMath artifact '$($generated.Name)' differs from source."
              }
          }

      - name: Restore the formula profile generator
        run: >-
          dotnet restore build/MathBlocks.FormulaProfileGenerator/MathBlocks.FormulaProfileGenerator.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/formula-generator"

      - name: Build the formula profile generator
        run: >-
          dotnet build build/MathBlocks.FormulaProfileGenerator/MathBlocks.FormulaProfileGenerator.csproj
          -c Release --no-restore --no-incremental --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/formula-generator"

      - name: Generate formula verification artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:FORMULA_EVIDENCE -Force | Out-Null
          $generator = Join-Path `
            $env:ARTIFACT_ROOT `
            'formula-generator/bin/MathBlocks.FormulaProfileGenerator/release/MathBlocks.FormulaProfileGenerator.dll'
          dotnet $generator `
            --output "$env:FORMULA_EVIDENCE/generated-profile" `
            --openmath-sample "$env:FORMULA_EVIDENCE/sample.openmath.xml" `
            --mathml-sample "$env:FORMULA_EVIDENCE/sample.mathml"

      - name: Verify generated formula profile artifacts
        shell: pwsh
        run: |
          $generatedRoot = Join-Path $env:FORMULA_EVIDENCE 'generated-profile'
          $generatedFiles = @(Get-ChildItem $generatedRoot -File | Sort-Object Name)
          if ($generatedFiles.Count -ne 5) {
              throw 'The formula profile generator did not create five generated artifacts.'
          }

          foreach ($generated in $generatedFiles) {
              $tracked = Join-Path 'formula/v1' $generated.Name
              $expectedHash = (Get-FileHash $tracked -Algorithm SHA256).Hash
              $actualHash = (Get-FileHash $generated.FullName -Algorithm SHA256).Hash
              if ($actualHash -ne $expectedHash) {
                  throw "The generated formula artifact '$($generated.Name)' differs from source."
              }
          }

      - name: Install formula validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jing libxml2-utils unzip

      - name: Download the normative OpenMath schemas
        run: |
          mkdir -p "$OPENMATH_EVIDENCE/openmath-2.0r2"
          curl --fail --location --silent --show-error \
            --output "$OPENMATH_EVIDENCE/openmath-2.0r2/openmath2.rnc" \
            https://openmath.org/standard/om20-2019-07-01/openmath2.rnc
          curl --fail --location --silent --show-error \
            --output "$OPENMATH_EVIDENCE/openmath-2.0r2/omcd2.rnc" \
            https://openmath.org/standard/om20-2019-07-01/omcd2.rnc
          curl --fail --location --silent --show-error \
            --output "$OPENMATH_EVIDENCE/openmath-2.0r2/omcdgroup2.rnc" \
            https://openmath.org/standard/om20-2019-07-01/omcdgroup2.rnc
          cd "$OPENMATH_EVIDENCE/openmath-2.0r2"
          echo 'F3C8BE33ED29701FF4DC36AAD08E30291487740FCFD801DB971CCCF411724A24  openmath2.rnc' | sha256sum --check
          echo 'B38F325A4695ADA7B71E786127FA9E4E81564434E0DDF2A66F87F8B303B13157  omcd2.rnc' | sha256sum --check
          echo '05022254EBEBF3E9FE37AB919C2A8A793EA42373488E62C0E0033C34F9772411  omcdgroup2.rnc' | sha256sum --check

      - name: Download the normative MathML 3 schema
        run: |
          curl --fail --location --silent --show-error \
            --output "$FORMULA_EVIDENCE/mathml3-relaxng.zip" \
            https://www.w3.org/Math/RelaxNG/mathml3-relaxng.zip
          cd "$FORMULA_EVIDENCE"
          echo '1EA59A8D772702F88A6E7D3ADF4F15128BB1AE184D4E93CD6846F3675DDC28A4  mathml3-relaxng.zip' | sha256sum --check
          unzip -q "$FORMULA_EVIDENCE/mathml3-relaxng.zip" \
            -d "$FORMULA_EVIDENCE/w3c-mathml3"

      - name: Validate the OpenMath profile
        run: |
          schema_root="$OPENMATH_EVIDENCE/openmath-2.0r2"
          for document in openmath/v1/*.ocd; do
            jing -c "$schema_root/omcd2.rnc" "$document"
          done
          jing -c "$schema_root/omcdgroup2.rnc" openmath/v1/mathblocks_profile1.cdg
          for document in canonical-sample.xml catalog-sample.xml; do
            jing -c "$schema_root/openmath2.rnc" "$OPENMATH_EVIDENCE/$document"
            jing -c openmath/v1/mathblocks_profile1.rnc "$OPENMATH_EVIDENCE/$document"
            xmllint --c14n11 "$OPENMATH_EVIDENCE/$document" > "$OPENMATH_EVIDENCE/$document.c14n11"
            cmp "$OPENMATH_EVIDENCE/$document" "$OPENMATH_EVIDENCE/$document.c14n11"
          done

      - name: Validate the formula interchange profile
        run: |
          schema_root="$OPENMATH_EVIDENCE/openmath-2.0r2"
          for document in formula/v1/*.ocd; do
            jing -c "$schema_root/omcd2.rnc" "$document"
          done
          jing -c "$schema_root/omcdgroup2.rnc" formula/v1/mathblocks_formula_profile1.cdg
          jing -c "$schema_root/openmath2.rnc" "$FORMULA_EVIDENCE/sample.openmath.xml"
          jing -c formula/v1/mathblocks_formula_openmath1.rnc "$FORMULA_EVIDENCE/sample.openmath.xml"
          jing "$FORMULA_EVIDENCE/w3c-mathml3/mathml3/mathml3.rng" \
            "$FORMULA_EVIDENCE/sample.mathml"
          jing -c formula/v1/mathblocks_formula_mathml1.rnc "$FORMULA_EVIDENCE/sample.mathml"
          jing -c formula/v1/mathblocks_formula_mappings1.rnc \
            formula/v1/mathblocks_formula_mappings1.xml
          xmllint --noout formula/v1/mathblocks_formula_mappings1.xml
          test "$(grep -c '<operation ' formula/v1/mathblocks_formula_mappings1.xml)" -eq 337
          test "$(grep -c 'classification="direct-mapping"' formula/v1/mathblocks_formula_mappings1.xml)" -eq 337
          test "$(grep -c 'classification="canonical-pattern-mapping"' formula/v1/mathblocks_formula_mappings1.xml || true)" -eq 0
          test "$(grep -c 'classification="unsupported"' formula/v1/mathblocks_formula_mappings1.xml || true)" -eq 0
          for document in sample.openmath.xml sample.mathml; do
            xmllint --c14n11 "$FORMULA_EVIDENCE/$document" > "$FORMULA_EVIDENCE/$document.c14n11"
            cmp "$FORMULA_EVIDENCE/$document" "$FORMULA_EVIDENCE/$document.c14n11"
          done

      - name: Restore the exact package candidate
        run: >-
          dotnet restore Supprocom.MathBlocks/Supprocom.MathBlocks.csproj
          --force-evaluate -p:NuGetAuditMode=all --artifacts-path "$ARTIFACT_ROOT/package"

      - name: Pack the exact source candidate
        run: >-
          dotnet pack Supprocom.MathBlocks/Supprocom.MathBlocks.csproj
          -c Release --no-restore --warnaserror
          --artifacts-path "$ARTIFACT_ROOT/package"
          --output "$PACKAGE_EVIDENCE"
          -p:RepositoryCommit="$GITHUB_SHA"
          -p:RepositoryBranch="$GITHUB_REF_NAME"
          -p:ExpectedRepositoryCommit="$GITHUB_SHA"
          -p:ExpectedRepositoryBranch="$GITHUB_REF_NAME"

      - name: Verify package provenance, symbols, Source Link, and contents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nupkgs < <(find "$PACKAGE_EVIDENCE" -maxdepth 1 -type f \
            -name 'Supprocom.MathBlocks.0.5.0.nupkg' -print)
          mapfile -t snupkgs < <(find "$PACKAGE_EVIDENCE" -maxdepth 1 -type f \
            -name 'Supprocom.MathBlocks.0.5.0.snupkg' -print)
          test "${#nupkgs[@]}" -eq 1
          test "${#snupkgs[@]}" -eq 1
          nupkg="${nupkgs[0]}"
          snupkg="${snupkgs[0]}"

          unzip -Z1 "$nupkg" | sort > "$PACKAGE_EVIDENCE/nupkg-contents.txt"
          for required in \
            README.md \
            LICENSE.md \
            THIRD-PARTY-NOTICES.md \
            docs/openmath-api.md \
            docs/formula-interchange-api.md \
            docs/programming-model.md \
            docs/cuda-integration.md \
            docs/development.md \
            lib/net10.0/Supprocom.MathBlocks.dll \
            lib/net10.0/Supprocom.MathBlocks.xml \
            formula/v1/README.md \
            formula/v1/mathblocks_formula1.ocd \
            formula/v1/mathblocks_formula_mappings1.rnc \
            formula/v1/mathblocks_formula_mappings1.xml \
            formula/v1/mathblocks_formula_mathml1.rnc \
            formula/v1/mathblocks_formula_openmath1.rnc \
            formula/v1/mathblocks_formula_operations1.ocd \
            formula/v1/mathblocks_formula_profile1.cdg \
            formula/v1/mathblocks_formula_values1.ocd; do
            grep -Fx "$required" "$PACKAGE_EVIDENCE/nupkg-contents.txt"
          done
          test "$(grep -c '^formula/v1/' "$PACKAGE_EVIDENCE/nupkg-contents.txt")" -eq 9

          unzip -p "$nupkg" Supprocom.MathBlocks.nuspec \
            > "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.nuspec"
          grep -F "branch=\"$GITHUB_REF_NAME\"" "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.nuspec"
          grep -F "commit=\"$GITHUB_SHA\"" "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.nuspec"
          unzip -p "$nupkg" lib/net10.0/Supprocom.MathBlocks.dll \
            > "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.dll"
          grep -aFq "$GITHUB_SHA" "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.dll"

          unzip -Z1 "$snupkg" | sort > "$PACKAGE_EVIDENCE/snupkg-contents.txt"
          grep -Fx 'lib/net10.0/Supprocom.MathBlocks.pdb' \
            "$PACKAGE_EVIDENCE/snupkg-contents.txt"
          test "$(grep -c '\.pdb$' "$PACKAGE_EVIDENCE/snupkg-contents.txt")" -eq 1
          unzip -p "$snupkg" lib/net10.0/Supprocom.MathBlocks.pdb \
            > "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.pdb"
          grep -aFq "https://raw.githubusercontent.com/Supprocom/MathBlocks/$GITHUB_SHA/*" \
            "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.pdb"

          cd "$PACKAGE_EVIDENCE"
          sha256sum ./*.nupkg ./*.snupkg > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Restore the exact-package consumer
        run: >-
          dotnet restore
          Supprocom.MathBlocks.ExternalConsumer/Supprocom.MathBlocks.ExternalConsumer.csproj
          --configfile Supprocom.MathBlocks.ExternalConsumer/NuGet.config
          --force-evaluate -p:NuGetAuditMode=all -p:MathBlocksVersion=0.5.0
          --artifacts-path "$ARTIFACT_ROOT/package-consumer"

      - name: Build and run the exact-package formula consumer
        run: |
          dotnet build \
            Supprocom.MathBlocks.ExternalConsumer/Supprocom.MathBlocks.ExternalConsumer.csproj \
            -c Release --no-restore --no-incremental --warnaserror \
            -p:MathBlocksVersion=0.5.0 \
            -p:CopyLocalLockFileAssemblies=false \
            --artifacts-path "$ARTIFACT_ROOT/package-consumer"
          cp \
            "$PACKAGE_EVIDENCE/Supprocom.MathBlocks.dll" \
            "$ARTIFACT_ROOT/package-consumer/bin/Supprocom.MathBlocks.ExternalConsumer/release/Supprocom.MathBlocks.dll"
          dotnet \
            "$ARTIFACT_ROOT/package-consumer/bin/Supprocom.MathBlocks.ExternalConsumer/release/Supprocom.MathBlocks.ExternalConsumer.dll" \
            --formula-smoke

      - name: Check the tracked diff
        run: git diff --check

      - name: Retain test and OpenMath evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathblocks-ci-evidence
          path: |
            /tmp/mathblocks-test-results
            /tmp/mathblocks-openmath-evidence
            /tmp/mathblocks-formula-evidence
            /tmp/mathblocks-openmath-fuzz
            /tmp/mathblocks-package-evidence
          if-no-files-found: error

  formula-artifact-byte-identity:
    name: Formula artifact bytes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Verify a clean autocrlf checkout against the embedded authority
        shell: pwsh
        run: |
          $clone = Join-Path $env:RUNNER_TEMP 'mathblocks-autocrlf-checkout'
          git -c core.autocrlf=true clone --no-hardlinks --no-tags --quiet . $clone
          if ($LASTEXITCODE -ne 0) {
              throw 'The clean autocrlf checkout failed.'
          }
          $clonedCommit = git -C $clone rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $clonedCommit -ne $env:GITHUB_SHA) {
              throw 'The clean autocrlf checkout is not the exact candidate commit.'
          }

          $authorityPath = Join-Path `
            $clone `
            'Supprocom.MathBlocks/Notation/MathBlockFormulaInterchange.Profile.cs'
          $authoritySource = Get-Content $authorityPath -Raw
          $matches = [regex]::Matches(
            $authoritySource,
            'new\("(?<name>[^\"]+)", (?<length>[0-9]+), "(?<sha>[0-9A-F]{64})", (?:true|false)\)')
          if ($matches.Count -ne 9) {
              throw 'The embedded formula artifact authority is incomplete.'
          }

          $formulaRoot = Join-Path $clone 'formula/v1'
          $tracked = @(Get-ChildItem $formulaRoot -File)
          if ($tracked.Count -ne $matches.Count) {
              throw 'The formula artifact set differs from the embedded authority.'
          }

          foreach ($match in $matches) {
              $path = Join-Path $formulaRoot $match.Groups['name'].Value
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "The formula artifact '$path' is missing."
              }
              $bytes = [IO.File]::ReadAllBytes($path)
              if ($bytes.Length -ne [int]$match.Groups['length'].Value) {
                  throw "The formula artifact '$path' has the wrong byte length."
              }
              if ($bytes -contains 13) {
                  throw "The formula artifact '$path' contains a carriage return."
              }
              $hash = (Get-FileHash $path -Algorithm SHA256).Hash
              if ($hash -ne $match.Groups['sha'].Value) {
                  throw "The formula artifact '$path' has the wrong SHA-256."
              }
          }
